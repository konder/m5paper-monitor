# M5PaperS3 监控 collector 配置

[mqtt]
# broker 地址。broker 与 collector 同机时填 127.0.0.1。
host = "127.0.0.1"
port = 1883
username = ""            # 留空 = 匿名
password = ""
state_topic = "m5paper/state"    # retained 全量快照(历史遗留,设备当前不订阅)
event_topic = "m5paper/events"   # 瞬时事件(完成/需输入/额度告警)
usage_topic = "m5paper/usage"    # retained 消耗看板(四行油量表)

[collector]
refresh_sec = 20         # 快照刷新间隔(秒)
with_quota = true        # 是否拉取额度(claude 走本地日志估算)

[thumb]
port = 8899              # 灰度缩略图 HTTP 服务端口 + OTA /fw(8080 被占)

[event]
port = 8898             # hook 事件接收端口(仅本机)
quota_alert_pct = 85   # 已用达此百分比即发额度告警(看板每行通用,含网关流量配额)

# ⚠️ 以下各节必须是扁平 key = value。Mac Mini 是 py3.9 没有 tomllib,
# 走 collector.py 的 _tiny_toml 回退,不支持数组和嵌套表。

[litellm]
# DGX 上的 litellm proxy。⚠️ 10.10.10.5(万兆直连)当前不通,走家里网段。
# base_url 或 api_key 留空 = 关掉该源,看板 LiteLLM 那行显示「旧」。
# 只有 token / 请求数,没有金额 —— 该 proxy 的自建模型没配单价,spend 恒为 0。
base_url = "http://192.168.101.128:4000"
api_key = ""             # general_settings.master_key
ttl_sec = 60

[gwtraffic]
# 代理网关 VPS 的 /run/gwtraffic.json。⚠️ ControlMaster socket 是 0600 owned by
# 当前用户 → 本采集必须以该用户跑(LaunchAgent 可以,root 的 LaunchDaemon 不行)。
host = ""                # 如 "root@1.2.3.4";留空 = 关掉该源
control_path = "~/.ssh/cm-gwtraffic.sock"
identity = "~/.ssh/id_ed25519"
ttl_sec = 30

[usage]
enabled = true
min_republish_sec = 300  # 无实质变化时的心跳重发间隔;rev 不变,设备不重绘
tz_offset_hours = 8      # 顶栏时钟的时区偏移。Mac Mini 系统时区是 US/Pacific,
                         # 直接用 localtime 会在墨水屏上显示美西时间(时钟本身是准的)

[channels]
# FW46 起设备是 **BLE-only** 的:数据全走 BLE,WiFi 只在 OTA / 屏幕 dump 时被临时借用。
#   ble  = true  → 经原生 Swift helper 直连设备,**完全不需要 mosquitto**
#   mqtt = true  → 已无意义(设备不再订阅 broker),除非你还有别的 MQTT 消费者
# ⚠️ 开 ble 前把下面 [ble] 的 hub_cmd 指对(v48 起框架是子进程,不再需要
#    让 collector 那个 python 能 import espble,PYTHONPATH 补丁已经删掉了)。
#    hub_cmd 指错时 BleChannel 会**当场抛异常**,make_channel 只 warn 一句
#    「BLE 渠道启动失败」然后继续 —— 如果 mqtt 也是 false,结果是
#    **一条渠道都没有、设备什么都收不到**,所以启动日志里那行 [chan] 要看一眼。
# ⚠️ helper 首次授权要在 GUI 会话里点一次(SSH 里 open 出来的拿不到 bluetoothd,
#    现象是事件流卡在 central_created —— 不是签名问题,见 esp-ble-link pitfalls B1)。
mqtt = false
ble = true

[ble]
# ---- 框架在哪(v48:从 import 换成子进程)----
# ⚠️ 这是**唯一**一处提到 esp-ble-link 的地方。m5work 的代码里零 `import espble`。
#
# 指向框架仓库自带的 shim。它自己处理 sys.path,所以**不需要 pip install** ——
# 这正是这次解耦要解决的问题:collector 跑 /usr/bin/python3(Xcode 3.9),
# 那个 pip 老到装不了 PEP 660 editable,以前只能在 LaunchAgent 里塞
# EnvironmentVariables: PYTHONPATH=…/esp-ble-link/host,而那个补丁不进版本控制。
#
# 留空 = ~/esp-ble-link/host/bin/espble hubd
hub_cmd = ""

# ---- 设备清单(v47:底座换成多设备的 BleHub)----
# 格式:"id:别名,id2:别名2"。别名可省(那就用 id 当显示名)。
#
# ⚠️ 为什么是这种扁平字符串而不是 TOML 数组:collector 的配置解析器 _tiny_toml
#    **只支持 [section] + 标量 key = value**,没有数组、没有 [[array of tables]]。
#    (collector 跑在 /usr/bin/python3 = Xcode 3.9,没有 tomllib,所以它就是生产解析器。)
#
# id 就是固件广播名的后缀:BLE_TYPE + efuse MAC 后 3 字节 → `m5paper-c119cc` 的 `c119cc`。
# 不知道 id 就跑一下:
#    espble scan --app ~/.local/espble/EspBleHub.app --scan-timeout 30
#
# ⚠️ 别名会被绑到 id 上并落进注册表,之后可以用别名当发送目标(hub.send("看板", …))。
#    重名会被拒绝 —— 否则路由无法确定。
devices = "c119cc:看板"
device_type = "m5paper"         # 广播名 = <device_type>-<id>,要和固件的 BLE_TYPE 一致

# ⚠️ **注意这里没有 device_name / name_prefix 了。** 多设备下每个 worker 必须按
#    **精确广播名**匹配:N 个 worker 共用一个前缀的话,谁先扫到哪台就抢哪台,
#    别名和 id 的绑定就废了 —— 发给"甲屏"的消息可能进了乙屏。BleHub 自动用
#    `<device_type>-<id>` 精确匹配,不需要你配。
helper_app = ""                 # 传给 hubd 的 --app。留空 = <repo>/.build/native/M5PaperBLEHelper.app
                                # 现在统一用单一 bundle:~/.local/espble/EspBleHub.app
registry = ""                   # 留空 = ~/.config/espble/devices.json(设备注册表,会落盘)
session_root = ""               # 留空 = ~/.config/espble/sessions;每台设备一个子目录
                                # ⚠️ 每设备独立 session_dir 是多进程互不干扰的关键 ——
                                #    helper 按 session-dir 认自己的进程,共用会互相误杀
reconnect_sec = 5               # 前几次的重试间隔(掉线就丢掉整个 helper 进程重开)
backoff_max_sec = 45            # 连续失败 5 次后放缓到这个间隔。
                                # (FW46 之前这里有个坑:设备每 5 分钟只广播 15s,
                                #  退避和那个窄窗口互相错过,实测 240s 一次都连不上。
                                #  BLE-only 之后设备一直在广播,这个参数不再敏感。)
keepalive_sec = 30              # 重发 retained 的 usage 探活(rev 不变→设备不重绘墨水屏)
history_n = 8                   # 重连后以 live:false 补发的最近事件条数
scan_timeout = 20               # helper 扫不到设备多久自杀,交给 Python 重开
