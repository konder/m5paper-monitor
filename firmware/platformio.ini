; M5PaperS3 AI Agent 监控面板固件
; 官方 PaperS3 配置(墨水屏由 ESP32-S3 直驱,经 epdiy;M5Unified 封装屏幕/触摸/IMU/RTC/蜂鸣器)

[platformio]
; 裸 `pio run` 只编设备固件。native 那个 env 只有 logic.cpp+shim.cpp、没有 main(),
; 是给 `pio test -e native` 用的 —— 不锁定的话 push_fw.sh 会连它一起编然后失败。
default_envs = PaperS3

[env:PaperS3]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 1500000

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=3

lib_deps =
  epdiy=https://github.com/vroland/epdiy.git#d84d26ebebd780c4c9d4218d76fbe2727ee42b47
  m5stack/M5Unified
  knolleary/PubSubClient
  bblanchon/ArduinoJson
  ; v40:BLE 链路层整块交给通用框架 esp-ble-link(原 src/blelink.{h,cpp})。
  ; NimBLE-Arduino 由它作为传递依赖自动带出,这里不用再单独列。
  ; 本工程不持有任何通信框架代码,也不复述协议细节(UUID / 帧上限 / 分片长度)。
  ;
  ; 本地开发要改框架时,临时换成 symlink://../../../esp-ble-link 指向工作副本。
  https://github.com/konder/esp-ble-link.git

; ---- 纯逻辑单测(宿主机跑,不需要设备)----
; 只编 logic.cpp —— 它不碰屏幕/射频/睡眠,所以能用系统 clang 直接编。
; 跑:  pio test -e native
; 覆盖:applyUsage 的 rev 去重、UsageRepaintGate 的重绘节流、summarize/addHistory、
;      onMessage/handleBleMessage 的命令分发。**测的是设备上跑的同一份源码**,
;      不是另写一份 —— tools/sim_render.py 那种并行实现会漂移,已经吃过亏。
[env:native]
platform = native
build_type = debug
test_framework = unity
; pio test 默认不编项目 src,不开这个的话 logic.cpp 压根不进测试二进制(表现为一堆 undefined symbol)
test_build_src = yes
test_filter = test_logic          ; 别把 test_render 拉进这个轻量 env(它不链 M5Unified/SDL)

; 设备构建看不到 native_shim/,它只在这里进 -I
build_src_filter = +<logic.cpp> +<../native_shim/shim.cpp>
build_flags =
  -std=gnu++17
  -Og -g
  -DNATIVE_TEST
  -I native_shim
  -I src
  ; 设备上 ARDUINO 宏会让 ArduinoJson 自动认 String;native 没这个宏,必须显式开,
  ; 否则 deserializeJson(doc, String) 会掉进泛型 Stream reader 去找 s.read()。
  -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
  ; 但垫片里没有 Stream/Print/PROGMEM,这三个要关掉
  -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
  -DARDUINOJSON_ENABLE_ARDUINO_PRINT=0
  -DARDUINOJSON_ENABLE_PROGMEM=0

lib_deps =
  bblanchon/ArduinoJson     ; header-only 且平台中立,native 下原样可用

; ---- render.cpp 的渲染测试(宿主机跑,不需要设备也不开窗口)----
; M5GFX 自带 SDL 后端 lgfx::Panel_sdl,而且它的非 ESP 分支硬编码了 M5PaperS3
; (960x540 / grayscale_8bit / offset_rotation=3),所以 render.cpp 一行不改就能跑。
; **不走 Panel_sdl::main()** —— 那条路会 SDL_CreateRenderer(ACCELERATED),无头环境起不来;
; 我们自己写 main(),画完直接 readRect 读 Panel_HasBuffer 的帧缓冲,压根不碰 renderer。
; 跑:  pio test -e native_render     产出 /tmp/render_native.pgm
[env:native_render]
platform = native
build_type = debug
test_framework = unity
test_build_src = yes
test_filter = test_render

build_src_filter = +<render.cpp> +<../native_shim/shim.cpp>
build_flags =
  -std=gnu++17
  -Og -g
  -DNATIVE_TEST
  ; 选板子:决定 Panel_sdl 的尺寸/旋转/色深,必须和真机一致
  -DM5GFX_BOARD=m5gfx::board_M5PaperS3
  -I native_shim
  -I src
  ; macOS 走 arm64 homebrew;Linux(CI)上这两个路径不存在,编译器会静默忽略,
  ; 而 /usr/include/SDL2 是默认搜索路径,所以同一份配置两边都能用。
  -I/opt/homebrew/include
  -L/opt/homebrew/lib
  -lSDL2

lib_deps =
  m5stack/M5Unified
