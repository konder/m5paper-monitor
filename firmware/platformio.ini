; M5PaperS3 AI Agent 监控面板固件
; 官方 PaperS3 配置(墨水屏由 ESP32-S3 直驱,经 epdiy;M5Unified 封装屏幕/触摸/IMU/RTC/蜂鸣器)
[env:PaperS3]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 1500000

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=3

lib_deps =
  epdiy=https://github.com/vroland/epdiy.git#d84d26ebebd780c4c9d4218d76fbe2727ee42b47
  m5stack/M5Unified
  knolleary/PubSubClient
  bblanchon/ArduinoJson
  ; v40:BLE 链路层抽到了通用框架 esp-ble-link(原 src/blelink.{h,cpp})。
  ; NimBLE-Arduino 由它作为传递依赖自动带出,这里不用再单独列。
  ; 框架尚未开源,先指本地路径(相对本 platformio.ini,即 ~/esp-ble-link);
  ; push 到 GitHub 之后换成 https://github.com/konder/esp-ble-link.git
  symlink://../../../esp-ble-link
